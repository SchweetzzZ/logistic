version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: logistics_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password5000
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
